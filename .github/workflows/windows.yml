name: Generar versión Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Copiar juego compilado
        shell: pwsh
        run: Copy-Item -Path dist -Destination desktop/game -Recurse
      - run: npm install
        working-directory: desktop
      - run: npm run package:win
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Slendytubbies-Noche-Windows-x64
          path: release/Slendytubbies-Noche-win32-x64/
          if-no-files-found: error
          retention-days: 30
